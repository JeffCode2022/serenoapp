name: serenazgo_app
description: Red Operativa Serenazgo Surquillo Sector 3
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State Management & Architecture
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  get_it: ^7.6.4
  # Networking & DB
  supabase_flutter: ^2.0.2
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  # Routing & External
  go_router: ^12.1.1
  url_launcher: ^6.3.0
  # UI & Styling
  google_fonts: ^6.1.0
  lucide_icons: ^0.257.0
  iconsax: ^0.0.8
  image_picker: ^1.2.2
  file_picker: ^11.0.2
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  isar_generator: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
